[package]
name = "kitty_mobile"
version = "0.2.2"
edition = "2021"
description = "Kitty Adventure: The Treetop Rescue, for Android, desktop and web (Rust + macroquad)"

# The game is a library so Android can load it (libkitty_mobile.so); `kitty` is the desktop and
# web executable around it.
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kitty"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same branch physics the pygame game uses, without its Python bindings
rusty_board = { path = "../Engines", default-features = false }

[profile.release]
lto = true

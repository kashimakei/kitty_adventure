[package]
name = "kitty_mobile"
version = "0.1.0"
edition = "2021"
description = "Feasibility spike: Kitty Adventure on macroquad for desktop, web, Android and iOS"

[dependencies]
macroquad = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same branch physics the pygame game uses, without its Python bindings
rusty_board = { path = "../Engines", default-features = false }

[profile.release]
lto = true

# Android packaging with cargo-quad-apk. It needs build-tools 30.0.3 (the last with `dx`) and
# platform 30; real phones are ARM, so emulator-only x86 targets are skipped.
[package.metadata.android]
assets = "assets"
label = "Kitty Adventure"
# cargo-quad-apk loads the native library named after the package name's last part, so it must
# match the crate name
package_name = "com.kashimakei.kitty_mobile"
android_version = 30
min_sdk_version = 26
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
fullscreen = true

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userPortrait"

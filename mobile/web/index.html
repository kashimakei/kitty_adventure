<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Kitty Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
                             position: absolute; background: #1c1c24; z-index: 0; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- Loader shipped with macroquad 0.4.14 (copied from the crate's js/ folder) -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // Progress lives in localStorage as JSON (see src/save.rs). Private windows and blocked
        // storage throw, so every access is guarded: the game just starts afresh.
        miniquad_add_plugin({
            name: "kitty_storage",
            version: 2,
            register_plugin: function (importObject) {
                var key = "kitty-adventure.save";
                // The single high score saved before levels were picked from a map
                var legacyKey = "kitty-adventure.high-score";
                // The save read by kitty_storage_load_len, waiting to be copied out
                var pending = null;
                importObject.env.kitty_storage_load = function () {
                    try {
                        var score = parseInt(window.localStorage.getItem(legacyKey), 10);
                        return score > 0 ? score >>> 0 : 0;
                    } catch (e) {
                        return 0;
                    }
                };
                importObject.env.kitty_storage_load_len = function () {
                    try {
                        var text = window.localStorage.getItem(key);
                        pending = text ? new TextEncoder().encode(text) : null;
                    } catch (e) {
                        pending = null;
                    }
                    return pending ? pending.length : 0;
                };
                importObject.env.kitty_storage_load_into = function (ptr, len) {
                    if (!pending) {
                        return 0;
                    }
                    var n = Math.min(len, pending.length);
                    new Uint8Array(wasm_memory.buffer, ptr, n).set(pending.subarray(0, n));
                    pending = null;
                    return n;
                };
                importObject.env.kitty_storage_save_text = function (ptr, len) {
                    try {
                        var text = new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len));
                        window.localStorage.setItem(key, text);
                    } catch (e) {
                        console.warn("couldn't save progress: " + e);
                    }
                };
            },
        });
        // build.sh adds the version, so browsers fetch a new build instead of a cached one
        load("kitty.wasm");
    </script>
</body>
</html>

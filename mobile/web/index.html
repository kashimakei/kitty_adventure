<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Kitty Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
                             position: absolute; background: #1c1c24; z-index: 0; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- Loader shipped with macroquad 0.4.14 (copied from the crate's js/ folder) -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // The high score lives in localStorage (see src/save.rs). Private windows and blocked
        // storage throw, so every access is guarded: the game just starts from 0.
        miniquad_add_plugin({
            name: "kitty_storage",
            version: 1,
            register_plugin: function (importObject) {
                var key = "kitty-adventure.high-score";
                importObject.env.kitty_storage_load = function () {
                    try {
                        var score = parseInt(window.localStorage.getItem(key), 10);
                        return score > 0 ? score >>> 0 : 0;
                    } catch (e) {
                        return 0;
                    }
                };
                importObject.env.kitty_storage_save = function (score) {
                    try {
                        window.localStorage.setItem(key, String(score >>> 0));
                    } catch (e) {
                        console.warn("couldn't save the high score: " + e);
                    }
                };
            },
        });
        load("kitty.wasm");
    </script>
</body>
</html>

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# No AndroidX: the app is one plain Activity around the native game.
android.useAndroidX=false
android.nonTransitiveRClass=true

# Android ABIs cargo-ndk builds the game for. Phones are arm64-v8a (and a few old armeabi-v7a
# ones); x86_64 is for the emulator. For a quicker build: ./gradlew assembleDebug -PrustAbis=arm64-v8a
rustAbis=arm64-v8a,armeabi-v7a,x86_64
